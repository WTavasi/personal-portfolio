# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Two jobs, as GitHub's own Pages workflows do: one builds and uploads the site, the other
# publishes it. The publish step looks the upload up by name; in the same job it sometimes asked
# before the upload was registered ("Found 0 artifact(s)"). As a separate job it starts only once
# the build job, upload included, has finished.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # First, so the build knows the site's address (for link previews and canonical links).
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          # Project pages are served from /<repo>/, so asset and page paths need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
